name: Tests

# Fast, offline checks on every push and pull request (a few minutes,
# well before the ~12 minute image build finishes):
#   - renderer: SGP4 against Skyfield reference positions, the
#     satellite list rules, rocket recognition and drawing, launch
#     visibility, launch label layout, cached compositing and the
#     data-source status file (renderer/tests)
#   - dashboard: Go unit tests

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'renderer/**'
      - 'dashboard/**'
      - '.github/workflows/tests.yml'

jobs:
  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libssl-dev pkg-config wget
      - name: Build and run renderer tests
        run: make -C renderer/tests -j"$(nproc)" check

  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - name: Go tests
        working-directory: dashboard
        run: go test ./...
