name: Tests

# Fast, offline checks on every push and pull request (a few minutes,
# well before the ~12 minute image build finishes):
#   - renderer: SGP4 against Skyfield reference positions, the
#     satellite list rules, rocket recognition and drawing, launch
#     visibility, launch label layout, cached compositing and the
#     data-source status file (renderer/tests)
#   - dashboard: Go unit tests

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'renderer/**'
      - 'dashboard/**'
      - 'helper/**'
      - 'os/**'
      - '.github/fetch-gfs.py'
      - '.github/test_fetch_gfs.py'
      - '.github/workflows/tests.yml'

jobs:
  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libssl-dev libdrm-dev libsdl2-dev pkg-config wget
      - name: Build and run renderer tests
        run: make -C renderer/tests -j"$(nproc)" check
      - name: Build the display backend and render a headless snapshot
        run: |
          make -C renderer -j"$(nproc)"
          renderer/pi-clock --snapshot "$RUNNER_TEMP/clock.png" --width 640 --height 360
          test -s "$RUNNER_TEMP/clock.png"

  data-and-boot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test slot health and GFS fallback
        run: |
          sh os/tests/slot-health.sh
          python3 -m unittest discover -s os/tests -v
          python3 -m unittest discover -s .github -p test_fetch_gfs.py -v
      - name: Test radar timing without fetching live feeds
        working-directory: helper
        run: |
          python3 -m venv "$RUNNER_TEMP/helper-venv"
          . "$RUNNER_TEMP/helper-venv/bin/activate"
          pip install numpy scipy requests eccodes opencv-python-headless
          python -m unittest discover -s tests -v
      - name: Test the Windows installer's settings step
        shell: pwsh
        run: ./helper/tests/test_install_config.ps1

  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - name: Go tests
        working-directory: dashboard
        run: go test ./...
